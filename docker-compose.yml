services:

  # ── PostgreSQL Database ────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ephem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ephem-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Odoo / ePHEM Application ───────────────────
  odoo:
    image: borrs/ephem:latest
    container_name: ephem-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - odoo-data:/var/lib/odoo
      # Production ERP addons: the dedicated, borse/ePHEM-decoupled repo
      # (github.com/Wael9912/erpmedsupply-addons) cloned beside this file.
      - ./erpmedsupply-addons:/mnt/extra-addons:ro
      # Nile backend theme (github.com/Wael9912/odoo-nile-theme).
      - ./odoo-nile-theme:/mnt/nile-theme:ro
      # Dev overrides this mount with the full borse/ePHEM checkout — see docker-compose.override.yml.
      - ./odoo.conf:/etc/odoo/odoo.conf
    networks:
      - ephem-internal
    expose:
      - "8069"
      - "8072"
    mem_limit: 2g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── NGINX Reverse Proxy ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ephem-nginx
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - ephem-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Certbot (SSL certificates) ─────────────────
  certbot:
    image: certbot/certbot
    container_name: ephem-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - ephem-internal
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  odoo-data:
  certbot-etc:
  certbot-www:

networks:
  ephem-internal:
    driver: bridge